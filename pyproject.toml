[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonia"
version = "0.1.0"
description = "Local TTS (Kokoro, Supertonic, Windows voices) and Whisper STT, as an OpenAI-compatible HTTP server and an MCP server"
requires-python = ">=3.12"

[project.scripts]
harmonia = "harmonia.__main__:main"
harmonia-mcp = "harmonia_mcp:main"

[tool.setuptools]
packages = ["harmonia"]
py-modules = ["harmonia_mcp"]
