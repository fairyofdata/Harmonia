[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localtts"
version = "0.1.0"
description = "Local TTS (Kokoro, Windows voices) and Whisper STT with an OpenAI-compatible HTTP server"
requires-python = ">=3.12"

[project.scripts]
localtts = "localtts.__main__:main"

[tool.setuptools]
packages = ["localtts"]
